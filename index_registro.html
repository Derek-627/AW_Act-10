<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guias WEB</title>
    <meta name="author" content="SirSalvador">
    <!--BootStrap-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-black">
    <header>
        <div class="container-fluid pt-3">
            <div class="d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <button class="btn btn-light boton-circulo me-3" type="button">
                        <i class="bi bi-list fs-4"></i>
                    </button>
                    <img class="logo-chico" src="images/Logo.png" alt="Logo Guias WEB">
                </div>
                <button class="btn btn-light boton-circulo" type="button">
                    <i class="bi bi-person fs-4"></i>
                </button>
            </div>
        </div>
    </header>


    <main>
        <div class="container">
            <div class="row justify-content-center mt-4">
                <div class="col-10 col-sm-8 col-md-5 col-lg-3">
                    <div class="caja-gris p-4">
                        <h1 class="boton-gris text-center fs-4 py-3 mb-4">Register</h1>
                        <form>
                            <div class="input-group campo-oscuro mb-2">
                                <span class="input-group-text bg-transparent border-0 text-light"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control bg-transparent border-0 text-light" placeholder="Username">
                            </div>
                            <div class="input-group campo-oscuro mb-2">
                                <span class="input-group-text bg-transparent border-0 text-light"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control bg-transparent border-0 text-light" placeholder="Email">
                            </div>
                            <div class="input-group campo-oscuro mb-3">
                                <span class="input-group-text bg-transparent border-0 text-light"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control bg-transparent border-0 text-light" placeholder="Password">
                            </div>
                            <div class="text-end">
                                <button type="submit" class="btn btn-dark btn-sm">Continue <i class="bi bi-arrow-right"></i></button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <button class="btn btn-light boton-circulo boton-soporte" type="button">
        <i class="bi bi-headset fs-4"></i>
    </button>
    <footer class="bg-dark text-light text-center py-3 mt-4">
        <p class="mb-0">Salvador Avalos MuñoZ UTL LEVN402</p>
    </footer>
    <!--JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
