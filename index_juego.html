<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guias WEB</title>
    <meta name="author" content="SirSalvador">
    <!--BootStrap-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>


<body class="bg-black">
    <div class="container-fluid py-3">
        <div class="row">
            <aside class="col-md-3 col-lg-2 mb-3">
                <!-- Logo -->
                <div class="text-center mb-2">
                    <img class="logo-chico" src="images/Collage.png" alt="Logo Guias WEB">
                </div>
                <div class="caja-gris text-center py-2 mb-3">
                    <span>Game Name</span>
                </div>
                <!-- Imagen del juego -->
                <div class="d-flex justify-content-center mb-3">
                    <img class="imagen-juego rounded-circle bg-light" src="" alt="Imagen del juego">
                </div>
                <div class="caja-gris p-3">
                    <p class="text-center small mb-1">Navigation</p>
                    <div class="caja-oscura mb-3"></div>
                    <p class="text-center small mb-1">Quick Access</p>
                    <div class="caja-oscura"></div>
                </div>
            </aside>

            <main class="col-md-9 col-lg-10">
                <div class="row align-items-center mb-3">
                    <div class="col-10">
                        <div class="input-group caja-gris">
                            <span class="input-group-text bg-transparent border-0"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control bg-transparent border-0" placeholder="Search">
                        </div>
                    </div>
                    <div class="col-2 text-end">
                        <button class="btn btn-light boton-circulo" type="button">
                            <i class="bi bi-person fs-4"></i>
                        </button>
                    </div>
                </div>
                <div class="caja-gris p-4">
                    <h1 class="fs-3 mb-3">Main Page</h1>
                    <div class="caja-negra mb-4 p-3"></div>

                    <h2 class="fs-4 mb-3">Content</h2>
                    <div class="caja-negra contenido p-3"></div>
                </div>
            </main>
        </div>
    </div>
    <footer class="bg-dark text-light text-center py-3 mt-4">
        <p class="mb-0">Salvador Avalos MuñoZ UTL LEVN402</p>
    </footer>
    <!--JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
