<!DOCTYPE html>
<html lang="es">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guias WEB</title>
    <meta name="author" content="SirSalvador">
    <!--BootStrap-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="css/styles.css">
</head>


<body class="bg-black">
    <header>
        <div class="container-fluid pt-3">
            <div class="row align-items-center">
                <div class="col-4 col-md-3 d-flex">
                    <button class="btn btn-light boton-circulo me-3" type="button">
                        <i class="bi bi-list fs-4"></i>
                    </button>
                    <button class="btn btn-light boton-circulo" type="button">
                        <i class="bi bi-person fs-4"></i>
                    </button>
                </div>
                <div class="col-8 col-md-6 text-center">
                    <img class="logo" src="images/Collage.png" alt="Logo Guias WEB">
                </div>
                <div class="col-12 col-md-3 mt-md-0  mt-3">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" placeholder="Search">
                    </div>
                </div>
            </div>
        </div>

    <nav class="container-fluid mt-4">
        <ul class="nav nav-pills justify-content-center">
            <li class="nav-item">
                <a class="nav-link enlace-menu enlace-activo" href="#">Games</a>
            </li>
            <li class="nav-item">
                <a class="nav-link enlace-menu text-light" href="#">Guías</a>
            </li>
            <li class="nav-item">
                <a class="nav-link enlace-menu text-light" href="#">Comunidad</a>
            </li>
        <li class="nav-item">
                <a class="nav-link enlace-menu text-light" href="#">Noticias</a>
            </li>
        </ul>
    </nav>

    <main>
        <div class="container-fluid mt-4">
            <div class="row">
                <div class="col-lg-9 mb-3">
                    <div class="caja-gris barra mb-3 d-flex align-items-center px-3">
                        <span class="text-secondary">Avisos</span>
                    </div>
                    <div class="caja-gris bloque mb-3 p-4">
                        <h2 class="fs-4">Guías Destacadas</h2>
                    </div>
                    <div class="caja-gris bloque p-4">
                        <h2 class="fs-4">Noticias</h2>
                    </div>
                </div>
                <div class="col-lg-3 mb-3">
                    <div class="caja-gris lateral p-4">
                        <h2 class="fs-5">Novedades</h2>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <!--Footer-->
    <footer class="bg-dark text-light text-center py-3 mt-4">
        <p class="mb-0">Salvador Avalos MuñoZ UTL LEVN402</p>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
