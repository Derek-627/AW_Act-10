<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guias WEB</title>
    <meta name="author" content="SirSalvador">
    <!--BootStrap-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-black">
    <header>
        <div class="container-fluid pt-3">
            <div class="d-flex justify-content-between">
                <button class="btn btn-light boton-circulo" type="button">
                    <i class="bi bi-list fs-4"></i>
                </button>
                <button class="btn btn-light boton-circulo" type="button">
                    <i class="bi bi-person fs-4"></i>
                </button>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="row mt-4">
                <div class="col-12 text-center">
                    <img class="logo" src="images/Collage.png" alt="Logo Guias WEB">
                </div>
            </div>
            <div class="row justify-content-center mt-5">
                <div class="col-8 col-sm-6 col-md-4 col-lg-3">
                    <button class="btn boton-gris w-100 py-3 mb-3" type="button">Log in</button>
                    <button class="btn boton-gris w-100 py-3 mb-3" type="button">Register</button>
                    <button class="btn boton-gris w-100 py-3 mb-3" type="button">Invitado</button>
                </div>
            </div>
        </div>
    </main>

    <button class="btn btn-light boton-circulo boton-soporte" type="button">
        <i class="bi bi-headset fs-4"></i>
    </button>
    <footer class="bg-dark text-light text-center py-3 mt-4">
        <p class="mb-0">Salvador Avalos MuñoZ UTL LEVN402</p>
    </footer>

    <!--JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
